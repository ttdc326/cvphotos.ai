<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio - Tạo Ảnh Chân Dung Công Sở</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .blur-result {
            filter: blur(15px);
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg font-bold text-lg">AI</div>
                <span class="font-extrabold text-xl tracking-tight">Studio<span class="text-blue-600">.vn</span></span>
            </div>
            <span class="text-xs bg-emerald-50 text-emerald-700 px-2 py-1 rounded-full font-bold border border-emerald-200">FREE HD 2026</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8">

        <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><span class="bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span> Tải khuôn mặt của bạn</h2>
                <label class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer transition bg-slate-50 hover:bg-blue-50 group">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 group-hover:text-blue-500 mb-2"></i>
                    <span class="font-medium">Bấm để tải ảnh mặt</span>
                    <input type="file" id="user-upload" class="hidden" onchange="previewImg(event)">
                </label>
                <div id="preview-box" class="mt-4 hidden relative rounded-lg overflow-hidden border bg-black h-40 flex justify-center">
                    <img id="preview-img" src="" class="h-full object-contain">
                    <button onclick="resetImg()" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full shadow-lg"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><span class="bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span> Chọn mẫu Vest Studio</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div id="card-den" onclick="selectVest('vest-den')" class="border-4 border-blue-600 rounded-2xl p-2 cursor-pointer transition-all relative overflow-hidden group">
                        <img src="/vest-den.png" class="w-full h-40 object-cover rounded-xl group-hover:scale-105 transition">
                        <div class="absolute bottom-0 inset-x-0 bg-black/50 text-white text-center py-1 text-sm font-bold">Vest Đen</div>
                        <div id="check-den" class="absolute top-2 right-2 bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center"><i class="fa-solid fa-check"></i></div>
                    </div>
                    <div id="card-xam" onclick="selectVest('vest-xam')" class="border-4 border-transparent rounded-2xl p-2 cursor-pointer transition-all relative overflow-hidden group bg-slate-100">
                        <img src="/vest-xam.png" class="w-full h-40 object-cover rounded-xl group-hover:scale-105 transition">
                        <div class="absolute bottom-0 inset-x-0 bg-black/50 text-white text-center py-1 text-sm font-bold">Vest Xám</div>
                        <div id="check-xam" class="absolute top-2 right-2 bg-blue-600 text-white w-6 h-6 rounded-full hidden items-center justify-center"><i class="fa-solid fa-check"></i></div>
                    </div>
                </div>
                <button onclick="handleSwap()" class="w-full mt-8 bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-xl transition-all transform active:scale-95 text-lg">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> TIẾN HÀNH GHÉP ẢNH AI
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col h-[650px]">
            <h2 class="font-bold text-xl mb-6 flex items-center gap-2 text-slate-700"><i class="fa-solid fa-image text-blue-600"></i> Ảnh kết quả của bạn</h2>

            <div class="flex-1 bg-slate-100 rounded-2xl overflow-hidden relative border border-slate-200" id="display-area">
                <div id="state-empty" class="h-full flex flex-col items-center justify-center text-slate-400 gap-3">
                    <i class="fa-regular fa-image text-6xl"></i>
                    <p class="font-medium italic">Kết quả sẽ hiển thị tại đây...</p>
                </div>

                <div id="state-loading" class="h-full hidden flex flex-col items-center justify-center bg-white/80 z-10">
                    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <p class="mt-4 font-bold text-blue-600">AI ĐANG XỬ LÝ KHUÔN MẶT...</p>
                </div>

                <div id="state-locked" class="h-full hidden relative">
                    <img id="img-locked" src="" class="w-full h-full object-contain blur-result">
                    <div class="absolute inset-0 bg-black/40 flex flex-col items-center justify-center text-white text-center p-6">
                        <i class="fa-solid fa-lock text-5xl mb-4 text-amber-400 drop-shadow-lg"></i>
                        <h3 class="text-2xl font-black mb-2 tracking-
